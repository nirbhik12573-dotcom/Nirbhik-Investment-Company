{% extends "base.html" %}

{% block title %}
Login | Nirbhik Investment Company
{% endblock title %}

{% block content %}

<section class="flex min-h-[70vh] items-center justify-center px-4 py-12">

    <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-lg ring-1 ring-slate-200 sm:p-8">

        <div class="mb-8 text-center">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.25em] text-sky-600">
                Nirbhik Investment Company
            </p>

            <h1 class="text-3xl font-bold text-slate-900">
                Login
            </h1>

            <p class="mt-3 text-sm text-slate-600">
                Login to continue.
            </p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- Keeps the requested page after login -->
            <input
                type="hidden"
                name="next"
                value="{{ next|default:'' }}"
            >

            <div>
                <label
                    for="username"
                    class="mb-2 block text-sm font-medium text-slate-700"
                >
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    placeholder="Enter your username"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
                >
            </div>

            <div>
                <label
                    for="password"
                    class="mb-2 block text-sm font-medium text-slate-700"
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Enter your password"
                    class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-sky-700"
            >
                Login
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
            Don't have an account?

            <a
                href="{% url 'register' %}"
                class="font-semibold text-sky-600 hover:text-sky-800"
            >
                Register Account
            </a>
        </p>

    </div>

</section>

{% endblock content %}
